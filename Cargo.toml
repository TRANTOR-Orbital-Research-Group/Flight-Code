[package]
name = "flight-code"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "flight-code" 
test = false
bench = false

[dependencies]
# Cortex-M 
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"

# Panic Handler
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# Defmt Logging
defmt = "1.0.1"
defmt-rtt = "1.1.0"

# The RTIC framework
rtic = { version = "2.1.3", features = ["thumbv8main-backend"] }
rtic-monotonics = { version = "2.0.2", features = ["rp235x"] }

# Our HAL
rp235x-hal = { version = "0.3.0", features = ["rt", "critical-section-impl"] }

# SD card dependencies
embedded-hal-bus = "0.2.0"
usbd-serial = "0.2.2"
usb-device = "0.3.2"
heapless = "0.8.0"
embedded-sdmmc = "0.8.1"
embedded-hal = "1.0.0"
panic-halt = "1.0.0"


# Trying to get serial to work
log = "0.4"

# Fast Universal General-purpose Interval and Time (it's a crate for time and things)
fugit = "0.3.9"
bme280 = "0.5.1"
bno08x-rs = "2.0.1"
